name: Release NXbox
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  actions: read
# Serialize version validation and publication; a release never replaces a newer one.
concurrency:
  group: nxbox-release
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Test release version policy
        run: python -m unittest discover -s tests/port -p test_release_version.py -v
      - name: Validate increasing package version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.json
          python tools/nxbox/release_version.py "$GITHUB_REF_NAME" releases.json >> "$GITHUB_OUTPUT"
  build:
    needs: version
    uses: ./.github/workflows/build-nxbox.yml
  package:
    needs: [version, build]
    uses: ./.github/workflows/package-nxbox.yml
    with:
      package_version: ${{ needs.version.outputs.package_version }}
    secrets: inherit
  helper:
    needs: version
    uses: ./.github/workflows/nxbhelper.yml
  publish:
    needs: [package, helper]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nxbox-release
          path: out
      - uses: actions/download-artifact@v4
        with:
          pattern: NxbHelper-*
          path: helper
      - name: Zip NxbHelper bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for bundle in helper/NxbHelper-*; do
            chmod +x "$bundle"/NxbHelper "$bundle"/nxbhelper-core 2>/dev/null || true
            (cd "$bundle" && zip -q -r "$GITHUB_WORKSPACE/out/$(basename "$bundle").zip" .)
          done
          # Publish legacy ZIP aliases only until the latest release already carries NxbHelper.
          previous_assets=$(gh release view -R NspxMiguel/NXbox --json assets --jq '.assets[].name')
          if ! printf '%s\n' "$previous_assets" | grep -q '^NxbHelper-'; then
            for archive in out/NxbHelper-*.zip; do
              cp "$archive" "${archive/NxbHelper-/NxHelper-}"
            done
          fi
          ls -l out
      - name: Publish signed package, NxbHelper and build information
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # v1.0.3 is "NXbox 1.0.3 Alpha"; a small necessary fix on top of it, v1.0.3.1, is "fix 1".
          IFS=. read -r major minor build fix <<< "${GITHUB_REF_NAME#v}"
          title="NXbox $major.$minor.$build Alpha"
          if [ -n "$fix" ] && [ "$fix" != 0 ]; then title="$title · fix $fix"; fi
          # NxbHelper is still a preview; gh prepends these notes to the generated changelog.
          notice='### What is new

          - **Keys, firmware and games folder in the setup**: the first-run setup now has a screen with Keys, Firmware and Games folder, each with a Select button that opens the file browser, plus files NXbox finds on your drives as suggestions. The same screen is in Settings → System. In the Files tab, the X menu has Install as firmware and Install keys
          - **Motion controls**: games that aim with the gyro (e.g. Tears of the Kingdom) get motion from the right stick while you hold L3; a quick tap of L3 still goes to the game. Also works with the remote and keyboard
          - **Pokémon Let’s Go Pikachu/Eevee**: the pad now presents itself as Joy-Cons in these two games, which only accept Joy-Cons on the "press a button on the controller" screen. We do not have the game to test it, tell us on Discord
          - **Graphics**: fixes for some ASTC textures and for a quad-strip drawing case; the renderer only waits on memory when the console really is short of it

          **Known issues:** black screen in Animal Crossing, black sky in Sparking Zero, the Wonder 1-2 seed, Nextendo online (error when entering online play).

          ### NxbHelper (preview)

          The NxbHelper zip files are a companion app that prepares a USB drive or sends your own games to NXbox through Device Portal. It is still in development: it may not work and has not been fully tested. You do not need it to use NXbox.'
          gh release create "$GITHUB_REF_NAME" out/*.appx out/*.zip out/build-info.json -R NspxMiguel/NXbox --title "$title" --verify-tag --latest --notes "$notice" --generate-notes
